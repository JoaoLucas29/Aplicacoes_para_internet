services:

  mysql:
    image: mysql:8.4
    container_name: ideiaviva-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ideiaviva
      MYSQL_USER: ideiaviva_user
      MYSQL_PASSWORD: ideiaviva123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  tomcat:
    image: tomcat:10.1-jdk21
    container_name: ideiaviva-tomcat

    ports:
      - "8080:8080"

    volumes:
      - ./deploy:/usr/local/tomcat/webapps

    depends_on:
      - mysql

volumes:
  mysql_data:
